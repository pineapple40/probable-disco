name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://trader:trader_dev_password@localhost:5432/probable_disco?schema=public"
  REDIS_URL: "redis://localhost:6379"
  SESSION_SECRET: "ci-only-insecure-secret-do-not-use-in-production-1234567890"
  CREDENTIALS_ENCRYPTION_KEY: "ci-only-insecure-32-byte-key-change-me"
  APP_URL: "http://localhost:3000"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader_dev_password
          POSTGRES_DB: probable_disco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d probable_disco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database (demo accounts used by e2e tests)
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
